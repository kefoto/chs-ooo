<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pip's Castle — odd-one-out study</title>
  <!-- The same picture the desktop build puts on its window (experiments/
       __init__.py's APP_ICON), so the tab a family sees and the taskbar icon
       at the facility are one identity. Relative, like every other asset
       here: utilities/export_public.py rewrites these when it generates the
       deploy's root index.html. -->
  <link rel="icon" type="image/png" href="assets/game/thumbnail/pip_head_happy.png">
  <link rel="stylesheet" href="js/vendor/jspsych.css">
  <link rel="stylesheet" href="js/css/game.css">
</head>
<body>
  <div id="jspsych-target"></div>

  <!-- Self-contained jsPsych build. NOT the CDN's ESM dist: that has bare
       imports ("auto-bind") a browser cannot resolve, and jsDelivr's /+esm
       output still fetches its dependencies from the CDN at runtime. This
       one is standalone, so the study also runs with no network. -->
  <script src="js/vendor/jspsych-8.2.1.browser.js"></script>
  <script type="module" src="js/src/main.js"></script>
</body>
</html>
